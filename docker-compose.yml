services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: websec
      POSTGRES_PASSWORD: websec
      POSTGRES_DB: websec_sandbox
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U websec -d websec_sandbox"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://websec:websec@postgres:5432/websec_sandbox
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-onboarding@resend.dev}
      APP_URL: ${APP_URL:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
