services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: websec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: websec_sandbox
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U websec -d websec_sandbox"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    image: ghcr.io/${GHCR_REPO}/backend:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql+asyncpg://websec:${POSTGRES_PASSWORD}@postgres:5432/websec_sandbox
      JWT_SECRET: ${JWT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-onboarding@resend.dev}
      APP_URL: ${APP_URL}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    image: ghcr.io/${GHCR_REPO}/frontend:${IMAGE_TAG:-latest}
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  postgres_data:
